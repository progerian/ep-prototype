<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile view (380px) — EP prototype</title>
<link rel="stylesheet" href="design-system/tokens/colors.css">
<style>
  /* Shows any prototype page inside a phone, in a real 380px viewport (so its mobile media queries apply). Usage: mobile-frame.html?p=photoset-mff.html. The phone scales to fit the window: the page never scrolls, only the site inside the screen does. */
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: var(--ep-grey-100); display: flex; align-items: center; justify-content: center; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .phone { position: relative; flex: none; width: 408px; height: 844px; box-sizing: border-box; padding: 14px; background: #111; border-radius: 62px; box-shadow: 0 0 0 2px #333 inset, 0 24px 60px rgba(0,0,0,.28); transform-origin: center; }
  .screen { position: relative; width: 380px; height: 816px; background: var(--ep-white); border-radius: 48px; overflow: hidden; display: flex; flex-direction: column; }
  .status { flex: none; height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; font-size: 15px; font-weight: 600; color: #111; background: var(--ep-white); }
  .status .island { position: absolute; left: 50%; top: 10px; width: 110px; height: 30px; margin-left: -55px; background: #111; border-radius: 15px; }
  .status .sys { letter-spacing: 1px; }
  iframe { flex: 1; width: 380px; border: 0; background: var(--ep-white); }
  .home-bar { flex: none; height: 24px; background: var(--ep-white); display: flex; align-items: center; justify-content: center; }
  .home-bar::after { content: ""; width: 128px; height: 5px; border-radius: 3px; background: #111; }
</style>
</head>
<body>
<div class="phone" id="phone"><div class="screen">
  <div class="status"><span>9:41</span><span class="island"></span><span class="sys">5G ▮▮▮</span></div>
  <iframe id="f" title="Mobile page"></iframe>
  <div class="home-bar"></div>
</div></div>
<script>
  // only same-folder prototype pages (no external URLs)
  const p = new URLSearchParams(location.search).get('p') || 'video-mff.html';   // starts on the streaming page
  const target = /^[\w.-]+\.html(\?[\w=&.%:-]*)?$/.test(p) ? p : 'homepage.html';
  // on a real phone the page itself is already the mobile view: no frame needed
  if (window.innerWidth < 500) location.replace(target); else document.getElementById('f').src = target;
  // scale the phone so it always fits the window height (no page scroll)
  const phone = document.getElementById('phone');
  const fit = () => { phone.style.transform = 'scale(' + Math.min(1, (innerHeight - 32) / 844, (innerWidth - 32) / 408) + ')'; };
  fit(); addEventListener('resize', fit);
</script>
</body>
</html>
