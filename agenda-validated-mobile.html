<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=380">
<title>EP Agenda — Validated version — Mobile (380px)</title>
<script>
  // Back to the desktop agenda when the window grows again — only if we got here from the desktop page (a mobile page opened directly stays mobile)
  (function () {
    var back = function () {
      var auto = false; try { auto = sessionStorage.getItem('agAutoMobile') === '1'; } catch (e) {}
      if (!auto) return;
      try { sessionStorage.removeItem('agAutoMobile'); } catch (e) {}
      location.replace('agenda-validated.html' + location.search + location.hash);
    };
    if (window.innerWidth >= 700) back();
    window.matchMedia('(min-width: 700px)').addEventListener('change', function (e) { if (e.matches) back(); });
  })();
</script>
<link rel="stylesheet" href="design-system/tokens/colors.css">
<link rel="stylesheet" href="design-system/tokens/spacing.css">
<link rel="stylesheet" href="design-system/tokens/typography.css">

<style>
  /* full-width page, no grey margins: the mobile layout fills whatever (narrow) window it is shown in */
  html, body { background: var(--ep-white); }
  body { margin: 0; }
  .m-frame { width: 100%; background: var(--ep-white); overflow: hidden; }
  .m-pad { padding-left: var(--ep-size-32); padding-right: var(--ep-size-32); }
  .m-header { display: flex; align-items: center; justify-content: space-between; padding-top: var(--ep-size-16); padding-bottom: var(--ep-size-16); }
  .m-header img { height: 44px; display: block; }
  .m-btns { display: flex; gap: var(--ep-size-12); }
  .m-btn { min-width: 44px; height: 44px; background: var(--ep-white); border: 2px solid var(--ep-blue-500); border-radius: var(--ep-radius-xs); color: var(--ep-blue-500); font-size: var(--ep-body-l-size); font-weight: 600; display: flex; align-items: center; justify-content: center; padding: 0 var(--ep-padding-l); }
  .m-sep { border-top: 1px solid var(--ep-grey-200); }
  .m-back { display: flex; align-items: center; gap: var(--ep-size-4); padding: var(--ep-size-16) 0; font-size: var(--ep-body-l-size); }
  h1 { margin: var(--ep-size-8) 0 var(--ep-size-24); font-size: var(--ep-heading-3xl-size); } /* 24px H1 -> Filters (redline) */
  .day-accordion-header { padding: var(--ep-size-16) 0; }
  .day-accordion-title { font-size: var(--ep-body-l-size); line-height: var(--ep-body-l-line); }
  /* Redline: Filters row is 24px high; 48px from Filters to the month label (24px to the panel when it is open) */
  /* Filters = full-screen cover-up on mobile (never an inline expand — hence no chevron on the toggle) */
  .m-filters-panel { position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: min(380px, 100%); background: var(--ep-white); z-index: 100; display: flex; flex-direction: column; }
  .m-filters-panel[hidden] { display: none; }
  .m-panel-header { display: flex; align-items: center; justify-content: space-between; padding: var(--ep-size-16) var(--ep-size-32); border-bottom: 1px solid var(--ep-grey-200); flex-shrink: 0; }
  .m-panel-back { appearance: none; background: none; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: var(--ep-size-4); padding: 0; margin-left: calc(-1 * var(--ep-size-8)); font-family: var(--ep-font-family); font-size: var(--ep-body-l-size); font-weight: 600; color: var(--ep-blue-500); }
  .m-panel-back:hover { color: var(--ep-blue-800); }
  .m-panel-body { flex: 1; overflow-y: auto; padding: var(--ep-size-24) var(--ep-size-32) var(--ep-size-32); }
  .m-panel-footer { flex-shrink: 0; padding: var(--ep-size-16) var(--ep-size-32); border-top: 1px solid var(--ep-grey-200); }
  .m-cta { appearance: none; width: 100%; height: 52px; margin: 0; border: none; border-radius: var(--ep-radius-xs); background: var(--ep-blue-500); color: var(--ep-white); font-family: var(--ep-font-family); font-size: var(--ep-body-l-size); font-weight: 700; cursor: pointer; }
  .m-cta:hover { background: var(--ep-blue-800); }
  .ftoggle { height: var(--ep-size-24); line-height: var(--ep-size-24); font-weight: 600; font-size: var(--ep-body-l-size); display: flex; align-items: center; margin-bottom: var(--ep-size-48); }
  .ag-month { margin-top: 0; }
  .pagination { gap: var(--ep-gap-s); } .nav-btn { padding: var(--ep-padding-3xs) var(--ep-gap-s); } .nav-label { display: none; } /* mobile pagination: arrows only */
  body.is-range .ag-back { margin-top: 0; } /* Filters already carries the 48px */
  .ag-back { font-size: var(--ep-body-l-size); display: inline-flex; align-items: center; gap: var(--ep-size-8); margin-bottom: var(--ep-size-8); }
  .ag-day { flex-basis: calc(100% / 3); } /* 3 days visible on mobile */
  .ag-foot { display: flex; justify-content: space-between; padding-top: var(--ep-size-24); font-size: var(--ep-body-l-size); font-weight: 600; }
  .ag-foot a { display: inline-flex; align-items: center; gap: var(--ep-size-8); }
  .ag-footer { margin-top: var(--ep-size-32); padding-top: var(--ep-size-32); padding-bottom: var(--ep-size-32); }
  .ag-footer-nav { margin-bottom: var(--ep-size-24); }
</style>
</head>
<body>

  </header>
  <div class="m-pad">

    <aside class="m-filters-panel" id="agFilters" role="dialog" aria-modal="true" aria-label="Filters" hidden>
      <div class="m-panel-header">
        <button class="m-panel-back" id="agFiltersBack" type="button"><svg class="icon icon-32" viewBox="0 0 24 24" aria-hidden="true"><polygon points="13.58 6.33 7.92 11.99 13.58 17.65 14.99 16.24 10.75 11.99 14.99 7.75 13.58 6.33"/></svg>Back</button>
        <a href="#" id="agClear" hidden>Clear filters ✕</a>
      </div>

        <div class="ag-filter-group" role="radiogroup" aria-label="Agenda view">

          <div class="dp-native-control"><input type="date" id="agFrom" class="dp-native-input"><span class="dp-native-icon" aria-hidden="true"><svg class="icon icon-20" viewBox="0 0 24 24"><path d="M16,5.01v-1h-2v1h-4v-1h-2v1h-3.99v15h15.99V5.01h-4ZM8,7.01v1h2v-1h4v1h2v-1h2v2H6.02v-2h1.99ZM6.02,18.01v-7h11.99v7H6.02Z"/></svg></span></div></div>
        <div class="ag-field"><label class="ag-field-label" for="agTo">To</label>
          <div class="dp-native-control"><input type="date" id="agTo" class="dp-native-input"><span class="dp-native-icon" aria-hidden="true"><svg class="icon icon-20" viewBox="0 0 24 24"><path d="M16,5.01v-1h-2v1h-4v-1h-2v1h-3.99v15h15.99V5.01h-4ZM8,7.01v1h2v-1h4v1h2v-1h2v2H6.02v-2h1.99ZM6.02,18.01v-7h11.99v7H6.02Z"/></svg></span></div></div></div>
      </div>

    </aside>

    <p class="ag-month" id="agMonth"></p>
    <div class="ag-week" id="agWeekNav">
      <button class="ag-week-arrow" id="agPrevWeek" type="button" aria-label="Previous week"><svg class="icon icon-32" viewBox="0 0 24 24"><polygon points="13.58 6.33 7.92 11.99 13.58 17.65 14.99 16.24 10.75 11.99 14.99 7.75 13.58 6.33"/></svg></button>
      <div class="ag-week-days" id="agWeekDays"></div>
      <button class="ag-week-arrow" id="agNextWeek" type="button" aria-label="Next week"><svg class="icon icon-32" viewBox="0 0 24 24"><polygon points="10.42 6.33 16.08 11.99 10.42 17.65 9.01 16.24 13.25 11.99 9.01 7.75 10.42 6.33"/></svg></button>
    </div>
      <div class="ag-today-row"><button class="ag-center" id="agCenter" type="button" aria-label="Center on today"><span>Today</span><svg class="icon icon-20 ag-center-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.77 11.32A7.8 7.8 0 1 1 15.66 5.11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt"/><path d="M18.58 6.66L12.93 7.06L15.75 1.76Z" fill="currentColor" stroke="none"/></svg></button></div>
    <a href="#" class="ag-back" id="agBack" hidden><svg class="icon icon-20" viewBox="0 0 24 24"><polygon points="20 11.01 7.83 11.01 11.08 7.76 9.66 6.35 4 12.01 9.66 17.67 11.07 16.25 7.83 13.01 20 13.01 20 11.01"/></svg> Back to single day</a>
    <div class="ag-meta"><p class="ag-count" id="agCount"></p></div>
      <hr class="divider" id="agRule">
    <div id="agList"></div>
    <nav class="pagination" id="agPager" aria-label="Pagination" hidden></nav>
    <nav class="ag-foot" id="agFoot" aria-label="Day navigation"></nav>
    <p class="ag-download"><svg class="icon icon-24" viewBox="0 0 24 24" style="color:var(--ep-blue-500)"><path d="M14.41,4.01H5v16h14v-11.41l-4.59-4.59ZM14,6.42l2.59,2.59h-2.59v-2.59ZM7,18.01V6.01h5s0,5,0,5h5v7H7Z"/></svg><a href="#" id="agDownload"></a></p>
  </div>

    <span class="ag-lang">English ⌄</span>
  </footer>
</div>
